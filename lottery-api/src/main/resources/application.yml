logging:
  config: classpath:log4j2-spring.xml
server:
    port: 8866
spring:
  application:
    name: lottery
  datasource:
    url: jdbc:mariadb://10.22.36.120:8833/lottery?useSSL=false&serverTimezone=UTC
    username: root
    password: 5F52uA8npe
    driver-class-name: org.mariadb.jdbc.Driver
  # DeepSeek 官方平台（https://platform.deepseek.com 申请 API Key）
  # 不要用 spring.ai.dashscope —— 那是阿里云百炼
  ai:
    model:
      chat: deepseek
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:xxxx}
      base-url: https://api.deepseek.com
      chat:
        options:
          # 调优 / 推荐：思考模型deepseek-v4-pro  deepseek-chat
          model: deepseek-v4-pro
          temperature: 0.9
          #max-tokens: 16384
mybatis-plus:
  configuration:
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml
lottery:
  llm:
    analysis:
      # java：主线程 Java 统计直方图，形态取最高频；llm：11 个形态各开线程向 LLM 要下一期值/区间
      engine: llm
      model: deepseek-chat
      temperature: 0.9
  model:
    path: E:\home\python\
    csv:
      ml: ml_features.csv
      sequence: sequence_features.csv
      markov: markov_features.csv
      history: history.csv
  cache:
    analysis:
      # 是否启用 L2 本地磁盘缓存
      disk-enabled: true
      # L2 磁盘缓存目录（存放 LLM 分析结果 JSON 文件）
      disk-dir: E:/home/cache/llm
      # L1 内存缓存最大容量
      memory-size: 1
